<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiswahili Audio Processing Pipeline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <header class="text-center py-4 mb-4">
            <h1 class="display-4 text-primary">
                <i class="fas fa-microphone-alt"></i>
                Kiswahili Audio Processing Pipeline
            </h1>
            <p class="lead">Speech Recognition • Sentiment Analysis • Text Summarization</p>
        </header>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Upload Section -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5><i class="fas fa-upload"></i> Audio Input</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h6>Upload Audio File</h6>
                                <input type="file" id="audioFile" class="form-control" accept="audio/*">
                                <button id="uploadBtn" class="btn btn-primary mt-2" disabled>
                                    <i class="fas fa-cloud-upload-alt"></i> Process Audio
                                </button>
                            </div>
                            <div class="col-md-6">
                                <h6>Record Audio</h6>
                                <button id="recordBtn" class="btn btn-success">
                                    <i class="fas fa-microphone"></i> Start Recording
                                </button>
                                <button id="stopBtn" class="btn btn-danger" disabled>
                                    <i class="fas fa-stop"></i> Stop Recording
                                </button>
                                <audio id="audioPlayback" controls class="d-none mt-2"></audio>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Loading Section -->
                <div id="loadingSection" class="card mb-4 d-none">
                    <div class="card-body text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">Processing audio through pipeline...</p>
                    </div>
                </div>

                <!-- Results Section -->
                <div id="resultsSection" class="d-none">
                    <!-- Transcription -->
                    <div class="card mb-3">
                        <div class="card-header bg-info text-white">
                            <h5><i class="fas fa-file-alt"></i> Speech Recognition</h5>
                        </div>
                        <div class="card-body">
                            <p id="transcriptionText" class="card-text"></p>
                        </div>
                    </div>

                    <!-- Sentiment Analysis -->
                    <div class="card mb-3">
                        <div class="card-header bg-warning text-dark">
                            <h5><i class="fas fa-heart"></i> Sentiment Analysis</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <strong>Sentiment:</strong> <span id="sentimentLabel" class="badge"></span>
                                </div>
                                <div class="col-md-6">
                                    <strong>Confidence:</strong> <span id="sentimentScore"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Summarization -->
                    <div class="card mb-3">
                        <div class="card-header bg-success text-white">
                            <h5><i class="fas fa-compress-alt"></i> Text Summary</h5>
                        </div>
                        <div class="card-body">
                            <p id="summaryText" class="card-text"></p>
                        </div>
                    </div>

                    <!-- Processing Time -->
                    <div class="alert alert-info">
                        <i class="fas fa-clock"></i> Processing completed in <strong id="processingTime"></strong> seconds
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
